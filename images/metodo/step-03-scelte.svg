<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="1067" height="1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Scelte — materiali e finiture">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2620"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg3)"/>
  <!-- material swatches grid -->
  <g stroke="#17130f" stroke-width="2">
    <rect x="96" y="150" width="96" height="96" fill="#e4572e" fill-opacity=".85"/>
    <rect x="208" y="150" width="96" height="96" fill="#e4d7c3" fill-opacity=".85"/>
    <rect x="96" y="262" width="96" height="96" fill="#8a6a4a" fill-opacity=".8"/>
    <rect x="208" y="262" width="96" height="96" fill="#3a352e"/>
  </g>
  <!-- wood grain hint on brown swatch -->
  <g stroke="#e4d7c3" stroke-opacity=".25" stroke-width="1.4">
    <line x1="104" y1="284" x2="184" y2="284"/>
    <line x1="104" y1="304" x2="184" y2="304"/>
    <line x1="104" y1="324" x2="184" y2="324"/>
  </g>
  <!-- fan of chips -->
  <g stroke="#e4d7c3" stroke-opacity=".5" stroke-width="2" fill="none">
    <rect x="150" y="392" width="100" height="26" rx="4" transform="rotate(-8 200 405)"/>
    <rect x="150" y="392" width="100" height="26" rx="4" transform="rotate(4 200 405)" stroke="#e4572e" stroke-opacity=".8"/>
  </g>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#e4d7c3" stroke-opacity=".14"/>
</svg>
