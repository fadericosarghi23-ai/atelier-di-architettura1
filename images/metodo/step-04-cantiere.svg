<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="1067" height="1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cantiere — realizzazione">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2620"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg4)"/>
  <!-- building outline under construction -->
  <g fill="none" stroke="#e4d7c3" stroke-opacity=".5" stroke-width="2.4" stroke-linejoin="round">
    <rect x="150" y="200" width="150" height="190"/>
    <line x1="150" y1="262" x2="300" y2="262"/>
    <line x1="150" y1="326" x2="300" y2="326"/>
    <line x1="225" y1="200" x2="225" y2="390"/>
  </g>
  <!-- scaffolding on the left -->
  <g fill="none" stroke="#e4d7c3" stroke-opacity=".35" stroke-width="2">
    <line x1="118" y1="190" x2="118" y2="392"/>
    <line x1="150" y1="190" x2="150" y2="392"/>
    <line x1="118" y1="230" x2="150" y2="230"/>
    <line x1="118" y1="290" x2="150" y2="290"/>
    <line x1="118" y1="350" x2="150" y2="350"/>
    <line x1="118" y1="230" x2="150" y2="290"/>
    <line x1="118" y1="290" x2="150" y2="350"/>
  </g>
  <!-- crane -->
  <g stroke="#e4572e" stroke-opacity=".9" stroke-width="2.6" fill="none" stroke-linecap="round">
    <line x1="250" y1="120" x2="250" y2="200"/>
    <line x1="210" y1="120" x2="320" y2="120"/>
    <line x1="290" y1="120" x2="290" y2="150"/>
  </g>
  <path d="M284 150 h12 v10 h-12 z" fill="#e4572e"/>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#e4d7c3" stroke-opacity=".14"/>
</svg>
