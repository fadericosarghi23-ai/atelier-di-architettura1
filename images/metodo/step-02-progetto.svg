<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="1067" height="1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Progetto — disegno su misura">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2620"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg2)"/>
  <!-- floor plan -->
  <g fill="none" stroke="#e4d7c3" stroke-opacity=".55" stroke-width="2.4" stroke-linejoin="round">
    <rect x="86" y="150" width="228" height="210"/>
    <line x1="200" y1="150" x2="200" y2="360"/>
    <line x1="86" y1="262" x2="200" y2="262"/>
    <!-- door arc -->
    <path d="M200 300 a30 30 0 0 1 -30 30" stroke="#e4572e" stroke-opacity=".9"/>
    <line x1="200" y1="300" x2="200" y2="330" stroke="#e4572e" stroke-opacity=".9"/>
    <!-- window ticks -->
    <line x1="120" y1="150" x2="168" y2="150" stroke-width="5" stroke="#e4572e" stroke-opacity=".8"/>
  </g>
  <!-- dimension line -->
  <g stroke="#e4d7c3" stroke-opacity=".3" stroke-width="1.6">
    <line x1="86" y1="386" x2="314" y2="386"/>
    <line x1="86" y1="380" x2="86" y2="392"/>
    <line x1="314" y1="380" x2="314" y2="392"/>
  </g>
  <!-- pencil -->
  <g transform="rotate(38 250 250)">
    <rect x="238" y="150" width="14" height="150" rx="2" fill="#e4d7c3" fill-opacity=".8"/>
    <path d="M238 300 h14 l-7 20 z" fill="#e4572e"/>
    <line x1="238" y1="172" x2="252" y2="172" stroke="#17130f" stroke-width="3"/>
  </g>
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="#e4d7c3" stroke-opacity=".14"/>
</svg>
